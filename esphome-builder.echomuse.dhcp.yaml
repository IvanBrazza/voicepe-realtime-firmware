# Per-device ESPHome Builder stub for the EchoMuse Voice PE satellite.
substitutions:
  name: my-echomuse-voice-pe
  friendly_name: EchoMuse Voice PE
  echomuse_host: 192.168.1.10       # stable EchoMuse controller IP or DNS name
  echomuse_port: "8767"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  api_key: !secret api_key

packages:
  echomuse:
    url: https://github.com/IvanBrazza/voicepe-realtime-firmware
    ref: main
    files: [home-assistant-voice.echomuse.yaml]
    refresh: 0s

dashboard_import:
  package_import_url: github://IvanBrazza/voicepe-realtime-firmware/home-assistant-voice.echomuse.yaml@main
  import_full_config: false
